# Role composition by player count. Pick the entry whose player count matches;
# "mafia"/"detective"/"doctor" counts, remainder are plain villagers.
# These ratios follow common Mafia/Werewolf convention (~1 mafia per 3-4 players).

role_setups:
  5:  { mafia: 1, detective: 1, doctor: 0 }
  6:  { mafia: 1, detective: 1, doctor: 1 }
  7:  { mafia: 2, detective: 1, doctor: 1 }
  8:  { mafia: 2, detective: 1, doctor: 1 }
  9:  { mafia: 2, detective: 1, doctor: 1 }
  10: { mafia: 3, detective: 1, doctor: 1 }
  12: { mafia: 3, detective: 1, doctor: 1 }
  15: { mafia: 3, detective: 1, doctor: 1 }

# Game-flow settings
reveal_role_on_death: false   # if true, everyone learns the role of anyone who died
max_days: 12                  # safety cap; game is declared a draw if exceeded (also bounds worst-case token spend)

# Hard per-game spending cap in USD. Checked before each new day/night, inside the
# day-discussion polling loop, and before each showdown revote, so a single expensive
# day can self-truncate instead of only being caught at the next day boundary -- the
# game then ends early as a draw with a system message recording why, same as hitting
# max_days. Set to null to disable (no cap).
max_cost_usd: 2.00

# Day discussion is an open floor, not a fixed speaking order: one random player
# opens, then each turn taps one alive player with messages left to decide whether
# to speak (exactly one message), think privately, or pass. Whoever was just
# addressed by name (e.g. "Player2, Player3, what do you think?") jumps the queue,
# so a direct question actually gets answered next turn instead of waiting for a
# fair random cycle -- otherwise turns cycle fairly through everyone still eligible.
# Each player gets at most this many messages per day. A real conversation doesn't
# poll every participant before concluding the room's gone quiet, so discussion ends
# after discussion_silence_threshold consecutive declines in a row -- not only once
# literally everyone has individually passed. This is also the main cost lever: the
# expensive case is always the tail end of a day where nobody has anything left to
# add, and this stops that from costing one call per remaining player. Raised from 3/4
# to 5/6 -- the tighter defaults made discussions feel too shallow; the $2 max_cost_usd
# cap is the real backstop against this getting expensive on a long/chatty game now.
# max_discussion_polls_per_day is only a hard safety backstop, not expected to bind.
max_messages_per_day: 4
discussion_silence_threshold: 6
max_discussion_polls_per_day: 1000

# Voting is a secret ballot -- players never learn who voted for whom, only the
# eventual outcome (see mafia_sim/game/state.py:log_vote). A tie at the top goes to
# a showdown: the tied players publicly make their case, then everyone revotes among
# just the tied set, repeating until one player has sole possession of the most
# votes. max_showdown_rounds bounds how many revotes can happen in one day; if still
# tied after that many rounds, tie_vote_policy decides the fallback.
max_showdown_rounds: 5
tie_vote_policy: random       # 'random' or 'no_elimination' -- fallback once max_showdown_rounds is exhausted

# Cost control: full day-by-day discussion text older than this many days is
# dropped from the prompt (system events -- deaths -- and votes stay for the
# whole game either way, since they're short and strategically load-bearing).
# Without this, every turn resends the entire game transcript, so prompt
# size -- and cost -- grows roughly quadratically with game length.
transcript_full_detail_days: 3

# A roster key (from whichever --models file is in use) to use as a dedicated
# day-summarizer -- automatically excluded from player sampling (see
# sim/tournament.py) so it's never also a participant under evaluation. Once a
# day's discussion ages out of the detail window above, it's compressed into
# one sentence (see mafia_sim/game/summarizer.py) instead of silently dropped,
# at the cost of one extra small call per day -- cheap relative to the full
# per-player-per-turn transcript resend it saves on every later call. Defaults
# to gpt-5.4-mini-or, a cheap model already in the OpenRouter roster; if that
# key isn't present in whichever --models file is active (e.g. models.yaml),
# summarization just silently stays off for that run. Set to null to disable
# outright.
summarizer_model: gpt-5.4-mini-or

# LLM call settings
temperature: 0.9
# Needs headroom for a real multi-sentence private "thought" plus the JSON structure
# around it -- and, for extended-thinking models (o-series, Gemini, some Grok/Claude
# modes), *invisible* reasoning tokens count against this budget too on OpenRouter's
# unified endpoint. At 500 this starved reasoning models down to ~50-character replies
# that never closed their JSON (confirmed via games/<id>.raw.jsonl response lengths),
# forcing a fallback to random moves every turn and making them look far less capable
# than they are. 1400 leaves real room for both.
max_tokens: 1400
# A showdown speech is deliberately longer-form than a normal chat message -- a real
# paragraph making a closing case, not a one-liner -- so it gets extra headroom on top
# of the base max_tokens above. Falls back to max_tokens if unset.
showdown_max_tokens: 2200
max_format_retries: 2           # re-prompt attempts if a model's JSON can't be parsed
request_timeout_seconds: 60
