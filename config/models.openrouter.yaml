# Alternate roster: every model routed through OpenRouter (https://openrouter.ai)
# instead of each provider's own API. One key (OPENROUTER_API_KEY), one prepaid
# balance, no per-provider billing setup needed.
#
# This is a parallel path, not a replacement for config/models.yaml -- run with
# either file via `--models config/models.openrouter.yaml`. vendor tags match
# models.yaml's convention so the same "never two models from one company in a
# game" sampling logic applies here too.
#
# All entries below were live-verified against OpenRouter's catalog and a real
# completion call on 2026-08-20. OpenRouter's catalog moves fast -- if a model_id
# 404s later, check https://openrouter.ai/api/v1/models for the current slug.

models:
  - key: claude-opus-5-or
    display_name: "Claude Opus 5 (OpenRouter)"
    provider: openai_compat
    vendor: anthropic
    model_id: anthropic/claude-opus-5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    open_source: false
    enabled: true

  # Disabled 2026-08-20: genuinely expensive per token via OpenRouter -- in one real
  # game it alone accounted for 50.2% of that game's entire cost ($0.2958 of $0.5898).
  # Not a bug like gemini-2.5-pro-or/glm-4.6-or above, just priced too high to keep in
  # the roster for cost-sensitive runs.
  - key: claude-sonnet-5-or
    display_name: "Claude Sonnet 5 (OpenRouter)"
    provider: openai_compat
    vendor: anthropic
    model_id: anthropic/claude-sonnet-5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    open_source: false
    enabled: false

  - key: claude-haiku-4-5-or
    display_name: "Claude Haiku 4.5 (OpenRouter)"
