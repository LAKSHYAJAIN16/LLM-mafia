  # Disabled 2026-08-20: in a real game, every single response from this model was
  # 44-82 characters -- vs. 300-2200 for every other model in the same game -- because
  # its extended-thinking tokens count against max_tokens on OpenRouter's unified
  # endpoint, so almost the entire budget was consumed by invisible reasoning before
  # any visible JSON could be written. Confirmed via games/<id>.raw.jsonl response
  # lengths. gemini-3.6-flash-or below is unaffected and stands in as the Google seat.
  - key: gemini-2.5-pro-or
    display_name: "Gemini 2.5 Pro (OpenRouter)"
